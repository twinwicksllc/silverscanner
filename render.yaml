services:
  # Web Service for Flask Application
  - type: web
    name: silver-scanner
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    
    # Environment Variables
    envVars:
      # Flask Configuration
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: HOST
        value: "0.0.0.0"
      - key: PORT
        value: "5000"
      
      # eBay API Configuration - Production
      - key: EBAY_USE_SANDBOX
        value: "False"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
      - key: EBAY_DEV_ID
        sync: false
      - key: EBAY_USER_TOKEN
        sync: false
      
      # Deal Detection Settings
      - key: DEAL_THRESHOLD_PERCENTAGE
        value: "83.0"
      - key: MIN_SELLER_FEEDBACK
        value: "98.0"
      - key: SCAN_INTERVAL_MINUTES
        value: "15"
      - key: MAX_ITEMS_PER_SCAN
        value: "200"
      
      # Email Notification Settings (Optional)
      - key: ENABLE_EMAIL_NOTIFICATIONS
        value: "False"
      
      # Logging
      - key: LOG_LEVEL
        value: "INFO"
    
    # Persistent disk for SQLite database
    disk:
      name: data
      mountPath: /opt/render/project/database
      sizeGB: 1

# Cron Jobs for automated scanning
crons:
  - name: automated-scan
    schedule: "0 */4 * * *"  # Run every 4 hours
    command: python -c "from app import deal_scanner; deal_scanner.perform_scan()"
    service: silver-scanner